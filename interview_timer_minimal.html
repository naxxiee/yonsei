<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>면접 타이머</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}

/* 준비 화면 상단 표시 */
.top{position:absolute;top:28px;left:34px;right:34px;display:flex;justify-content:space-between;color:#777;font-size:13px;letter-spacing:.04em;z-index:2}
.top.off{display:none}

/* 안내 헤더 바 (PDF 상단 바) */
#header{display:none;position:absolute;top:22px;left:50%;transform:translateX(-50%);width:min(88%,920px);z-index:4;background:#d4d4d4;color:#111;border-radius:8px;padding:10px 16px;font-size:13px;align-items:center;gap:10px}
#header.show{display:flex}
#header i{width:22px;height:22px;border-radius:50%;border:2px solid #555;flex:none}

/* 카메라 (녹화 화면) */
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000;visibility:hidden}
#camera.show{visibility:visible}
#shade{display:none;position:absolute;left:0;top:0;bottom:0;width:260px;z-index:2;background:linear-gradient(90deg,#000c,#0000)}
#shade.show{display:block}

/* 가운데 */
.center{position:relative;z-index:3;text-align:center;width:100%;padding:24px}
.center.hide{display:none}
.phase{font-size:clamp(16px,2.2vw,24px);color:#bbb;margin-bottom:26px;font-weight:500;letter-spacing:.04em}
.timer{font-size:clamp(100px,23vw,230px);font-weight:600;line-height:.95;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:#e8e8e8}
.timer.num{font-size:clamp(70px,12vw,130px);font-weight:400;letter-spacing:0}
.message{font-size:clamp(19px,3vw,30px);line-height:1.8;font-weight:500;white-space:pre-line;color:#f0f0f0;text-shadow:0 2px 10px #000}
.sub{margin-top:30px;color:#888;font-size:14px;white-space:pre-line}
.sub.big{font-size:clamp(18px,2.6vw,28px);line-height:1.8;color:#e0e0e0;margin-top:30px}

/* 좌상단 타이머 (면접 시간 / 최소 면접 시간) */
#side{display:none;position:absolute;left:34px;top:44px;z-index:5;text-shadow:0 2px 8px #000}
#side.show{display:block}
#side .lb{font-size:12px;color:#aaa;margin-bottom:4px}
#side .v{font-size:30px;font-weight:600;color:#ddd;font-variant-numeric:tabular-nums;margin-bottom:18px}

/* 녹화 표시 */
.rec{display:none;position:absolute;top:26px;right:32px;z-index:5;width:34px;height:34px;border-radius:50%;border:2px solid #fff;align-items:center;justify-content:center}
.rec::after{content:"";width:14px;height:14px;border-radius:50%;background:#fff}
.rec.show{display:flex}
#ring{display:none;position:absolute;left:34px;bottom:46px;width:40px;height:40px;border-radius:50%;border:2px solid #bbb;z-index:5}
#ring::after{content:"";position:absolute;inset:9px;border-radius:50%;border:2px solid #bbb}
#ring.show{display:block}

#controls{position:absolute;bottom:28px;display:flex;gap:10px;z-index:6;opacity:.18;transition:opacity .2s}
#controls:hover{opacity:1}
button{border:1px solid #444;background:#151515;color:#eee;padding:10px 16px;border-radius:7px;font-size:13px;cursor:pointer}
button.primary{background:#fff;color:#000;border-color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
#download{position:absolute;bottom:28px;left:0;right:0;text-align:center;z-index:6;font-size:13px}
#download a{color:#fff}
@media(max-width:600px){
 .top{top:18px;left:18px;right:18px}
 #side{left:16px;top:36px}#side .v{font-size:22px}
 .rec{top:16px;right:16px}#ring{left:16px;bottom:24px}
 #controls{bottom:18px}#header{top:12px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
 <div class="top" id="top"><span>INTERVIEW</span><span id="smallState">READY</span></div>
 <div id="header"><i></i><span>연세대학교 학생부종합전형[활동우수형] 면접</span></div>
 <video id="camera" autoplay muted playsinline></video>
 <div id="shade"></div>
 <div id="side">
  <div class="lb">면접 시간</div><div class="v" id="sideMain">05:00</div>
  <div class="lb">최소 면접 시간</div><div class="v" id="sideMin">02:00</div>
 </div>
 <div id="ring"></div>
 <div class="rec" id="rec"></div>
 <div class="center" id="center">
  <div class="phase" id="phase">면접 준비</div>
  <div class="timer" id="timer" style="display:none">05</div>
  <div class="message" id="message">면접을 시작할 준비가 되셨나요?</div>
  <div class="sub" id="sub">카메라와 마이크를 확인한 뒤 시작해 주세요.</div>
 </div>
 <div id="controls">
  <button id="permission">카메라·마이크 확인</button><button class="primary" id="start" disabled>시작</button><button id="reset">초기화</button>
 </div>
 <div id="download"></div>
</div>
<script>
const el=id=>document.getElementById(id);
const ANSWER=300,MIN=120;
/*
 header : 상단 안내 바
 cam    : 카메라 화면 + 녹화표시(REC) 표시
 record : 실제 녹화 저장 (답변 시간만)
 side   : 'static' = 05:00/02:00 고정, 'live' = 줄어드는 타이머 (min = 최소 면접 시간)
*/
const phases=[
 {name:'',type:'count',sec:5,num:true,big:true,header:true,label:'잠시 후 시험이 시작됩니다.'},
 {name:'',type:'message',sec:10,cam:true,side:'live',min:0,text:'연세대학교 학생부종합전형[활동우수형] 시험에 응시하였습니다.\n문헌정보학과에 지원하였습니다.'},
 {name:'',type:'count',sec:10,num:true,big:true,header:true,label:'잠시 후 지문 숙지가 [08:00] 동안 시작됩니다.\n지문 숙지 시간이 종료되면 자동으로 녹화가 진행됩니다.'},
 {name:'지문 숙지 시간',type:'count',sec:480,alarms:[60,10,5],side:'static'},
 {name:'',type:'count',sec:10,num:true,big:true,side:'static',label:'잠시 후 녹화가 자동으로 시작되오니\n준비하여 주시기 바랍니다.'},
 {name:'',type:'none',sec:ANSWER,cam:true,record:true,side:'live',min:MIN}
];
let stream=null,recorder=null,chunks=[],url=null,index=-1,endAt=0,active=false,frame=0,lastAlarm=null;
function tone(f=880,d=.2){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);o.onended=()=>c.close()}catch(e){}}
function clock(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function showCam(on){['camera','shade','rec','ring'].forEach(id=>el(id).classList.toggle('show',on));}
function enter(i){
 index=i;let p=phases[i];endAt=performance.now()+p.sec*1000;lastAlarm=null;
 el('top').classList.add('off');
 el('header').classList.toggle('show',!!p.header);
 el('center').classList.toggle('hide',p.type==='none');
 el('phase').textContent=p.name;el('phase').style.display=p.name?'block':'none';
 el('message').style.display=p.type==='message'?'block':'none';el('message').textContent=p.text||'';
 el('timer').style.display=p.type==='count'?'block':'none';el('timer').classList.toggle('num',!!p.num);
 el('sub').textContent=p.label||'';el('sub').classList.toggle('big',!!p.big);
 el('side').classList.toggle('show',!!p.side);
 if(p.side==='static'){el('sideMain').textContent=clock(ANSWER);el('sideMin').textContent=clock(MIN);}
 showCam(!!p.cam);
 if(p.record)beginRecord();
 tick();
}
function tick(){
 if(!active)return;let p=phases[index],left=Math.max(0,(endAt-performance.now())/1000);
 if(p.type==='count')el('timer').textContent=p.num?String(Math.ceil(left)):clock(left);
 if(p.side==='live'){el('sideMain').textContent=clock(left);el('sideMin').textContent=clock(Math.max(0,left-(p.sec-p.min)));}
 if(p.alarms){for(let s of p.alarms){if(left<=s&&lastAlarm!==s){lastAlarm=s;tone(s===60?660:s===10?880:1100,.22);break;}}}
 if(left<=0){if(p.record)endRecord();if(index===phases.length-1){finish();return;}enter(index+1);return;}
 frame=requestAnimationFrame(tick);
}
async function permissions(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});el('camera').srcObject=stream;el('camera').play().catch(()=>{});el('start').disabled=false;el('sub').textContent='카메라와 마이크가 연결되었습니다.';el('smallState').textContent='READY';}
 catch(e){alert('카메라·마이크 권한을 허용해 주세요.');}
}
function beginRecord(){
 if(!stream){alert('카메라·마이크를 먼저 확인해 주세요.');reset();return;}
 chunks=[];let opt={};if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus'))opt.mimeType='video/webm;codecs=vp9,opus';
 try{recorder=new MediaRecorder(stream,opt);}catch(e){alert('현재 브라우저에서 녹화를 지원하지 않습니다. Chrome 또는 Edge를 이용해 주세요.');reset();return;}
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=save;recorder.start(1000);
}
function endRecord(){if(recorder&&recorder.state!=='inactive')recorder.stop();}
function save(){
 let blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);
 let a=document.createElement('a');a.href=url;a.download='interview-answer.webm';a.textContent='녹화 영상 다운로드';el('download').replaceChildren(a);
}
function finish(){
 active=false;cancelAnimationFrame(frame);
 el('top').classList.remove('off');el('header').classList.remove('show');
 el('center').classList.remove('hide');el('phase').style.display='block';el('phase').textContent='시험 종료';el('smallState').textContent='COMPLETE';
 el('timer').style.display='none';el('message').style.display='block';el('message').textContent='면접이 종료되었습니다.';
 el('sub').classList.remove('big');el('sub').textContent='녹화 영상을 확인해 주세요.';
 el('side').classList.remove('show');showCam(false);tone(700,.35);el('start').disabled=true;
}
function start(){if(!stream)return;el('controls').style.display='none';el('download').textContent='';active=true;enter(0);}
function reset(){
 active=false;cancelAnimationFrame(frame);if(recorder&&recorder.state!=='inactive')recorder.stop();index=-1;
 el('top').classList.remove('off');el('header').classList.remove('show');
 el('center').classList.remove('hide');el('phase').style.display='block';el('phase').textContent='면접 준비';el('smallState').textContent='READY';
 el('timer').style.display='none';el('message').style.display='block';el('message').textContent='면접을 시작할 준비가 되셨나요?';
 el('sub').classList.remove('big');el('sub').textContent='카메라와 마이크를 확인한 뒤 시작해 주세요.';
 el('side').classList.remove('show');showCam(false);
 el('controls').style.display='flex';el('download').textContent='';el('start').disabled=!stream;
}
el('permission').onclick=permissions;el('start').onclick=start;el('reset').onclick=reset;
</script>
</body></html>
